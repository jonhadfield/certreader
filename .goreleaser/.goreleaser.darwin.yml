version: 2

builds:
  - id: darwin-arm64
    env:
      - CGO_ENABLED=1
      - CC=clang
      - CXX=clang++
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -X main.Version={{.Version}}

  - id: darwin-amd64
    env:
      - CGO_ENABLED=1
      - CC=clang
      - CXX=clang++
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -X main.Version={{.Version}}

archives:
  # Create a single archive *group* (ID: darwin) that includes both mac builds
  - id: darwin
    ids:
      - darwin-arm64
      - darwin-amd64
    formats:
      - tar.gz

checksum:
  name_template: "checksums_darwin.txt"

# A formula rather than a cask, because homebrew marks what a cask installs
# com.apple.quarantine and gatekeeper then kills a bare binary that carries no
# stapled notarization ticket, which a bare binary has nowhere to keep. A
# formula is not quarantined, which is how every other go command line tool in
# homebrew arrives able to run.
#
# goreleaser calls this deprecated in favour of homebrew_casks. The cask is what
# certreader used until it turned out not to run when installed, so this stays
# until there is somewhere to staple a ticket to.
brews:
  - name: certreader
    # IMPORTANT: these are *archive* IDs, not build IDs:
    ids:
      - darwin
    homepage: https://github.com/jonhadfield/certreader
    description: Output detailed information about TLS certificates...
    commit_msg_template: "Brew formula update for {{ .ProjectName }} {{ .Tag }}"
    # a prerelease must not become what brew installs
    skip_upload: "auto"
    directory: Formula
    repository:
      owner: jonhadfield
      name: homebrew-certreader

release:
  github:
    owner: jonhadfield
    name: certreader
  prerelease: auto
  name_template: "{{ .Tag }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
