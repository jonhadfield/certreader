version: 2
updates:
  # vendor/ is kept in step with go.mod by dependabot itself
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # the golang.org/x modules move together, one pull request for them
      golang-x:
        patterns:
          - "golang.org/x/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
