name: go

on:
  push:
    branches:
      # '*' does not match branch names containing a slash, so feature/* pushes
      # were silently skipping this workflow entirely
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: setup go
        uses: actions/setup-go@v5
        with:
          # inputs is empty for a push trigger, so this pinned nothing and CI
          # silently used whatever go the runner shipped
          go-version-file: go.mod
      -
        name: go version
        run: go version
      -
        name: install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      -
        name: go test
        run: go test -v ./...
      -
        name: go vet
        run: go vet ./...
      -
        name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      -
        # trivy reads the dependency manifests; it does not tell us which go
        # patch the binaries are built with, and every standard library
        # advisory this tool reaches lives there
        name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
  scan:
    runs-on: ubuntu-latest
    steps:
      -
        name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

