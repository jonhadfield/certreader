name: release

on:
  push:
    tags:
      - 'v*'
  # lets preflight be run on demand to validate setup without cutting a tag
  workflow_dispatch:

# the repository default is read. Creating a release needs contents:write;
# recording who built an artefact needs an OIDC identity to sign with and
# somewhere to put the result.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      -
        name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: check release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. Releases need a personal access token with repo scope on both jonhadfield/certreader and jonhadfield/homebrew-certreader, because the darwin build pushes the cask update to the tap and the built-in GITHUB_TOKEN cannot write to another repository."
            exit 1
          fi
          echo "RELEASE_TOKEN is configured"
      -
        name: install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
      -
        name: validate goreleaser configs
        run: |
          for config in .goreleaser/.goreleaser.*.yml; do
            echo "checking $config"
            goreleaser check --config "$config"
          done
      -
        # created once here so the platform jobs can upload in parallel. Left to
        # themselves they would each find no release and race to create it.
        name: create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, leaving it alone"
            exit 0
          fi
          # a tag carrying a hyphen is a prerelease, matching what goreleaser
          # would have decided for itself
          prerelease=false
          case "$tag" in
            *-*) prerelease=true ;;
          esac
          # the annotation is the release body. It is read from the api rather
          # than the checkout, which does not fetch the annotated tag object, so
          # git would fall through to the commit message instead
          notes="$tag"
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
          if [ "$(echo "$ref" | jq -r '.object.type')" = "tag" ]; then
            annotation="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r '.object.sha')" --jq '.message')"
            if [ -n "$annotation" ]; then
              notes="$annotation"
            fi
          fi
          # the rest api rather than gh release create, which uses graphql and
          # so fails against a spent graphql budget while rest is still fine
          gh api "repos/$GITHUB_REPOSITORY/releases" --method POST -f tag_name="$tag" -f name="$tag" -f body="$notes" -F prerelease=$prerelease >/dev/null
          echo "created release $tag (prerelease=$prerelease)"

  release:
    needs: preflight
    # only publish for a tag; a manual run stops after preflight
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      # preflight creates the release, and goreleaser defaults to keeping an
      # existing one, so these only upload and can run together
      fail-fast: false
      matrix:
        include:
          - target: release-linux-amd64
            os: ubuntu-latest
          - target: release-windows-amd64
            os: ubuntu-latest
          - target: release-linux-arm64
            os: ubuntu-24.04-arm
          - target: release-windows-arm64
            os: ubuntu-24.04-arm
          - target: release-mac
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      -
        name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        # only the darwin target builds on the runner; the others build inside
        # goreleaser-cross, which brings its own go
        name: setup go
        if: matrix.target == 'release-mac'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      -
        # the linux and windows targets run goreleaser inside goreleaser-cross,
        # only the darwin target needs it on the runner itself
        name: install goreleaser
        if: matrix.target == 'release-mac'
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
      -
        name: ${{ matrix.target }}
        run: make ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      -
        # the linux and windows targets build as root inside the container, so
        # the archives come back owned by root and unreadable to the next step
        name: take ownership of the archives
        if: matrix.target != 'release-mac'
        run: sudo chown -R "$(id -u):$(id -g)" dist
      -
        # Says which workflow, from which commit, built these. A checksum
        # published beside the file it describes only shows the download was
        # not corrupted: whoever could change one could change the other. This
        # is verifiable against github rather than against the release:
        #
        #   gh attestation verify certreader_x.y.z_darwin_arm64.tar.gz --repo jonhadfield/certreader
        name: attest the archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
