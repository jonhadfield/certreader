name: release

on:
  push:
    tags:
      - 'v*'
  # lets preflight be run on demand to validate setup without cutting a tag
  workflow_dispatch:

# the repository default is read, and creating a release needs write
permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      -
        name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: check release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. Releases need a personal access token with repo scope on both jonhadfield/certreader and jonhadfield/homebrew-certreader, because the darwin build pushes the cask update to the tap and the built-in GITHUB_TOKEN cannot write to another repository."
            exit 1
          fi
          echo "RELEASE_TOKEN is configured"
      -
        name: install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
      -
        name: validate goreleaser configs
        run: |
          for config in .goreleaser/.goreleaser.*.yml; do
            echo "checking $config"
            goreleaser check --config "$config"
          done
      -
        # created once here so the platform jobs can upload in parallel. Left to
        # themselves they would each find no release and race to create it.
        name: create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists, leaving it alone"
            exit 0
          fi
          prerelease=""
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-from-tag --verify-tag $prerelease

  release:
    needs: preflight
    # only publish for a tag; a manual run stops after preflight
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      # preflight creates the release, and goreleaser defaults to keeping an
      # existing one, so these only upload and can run together
      fail-fast: false
      matrix:
        include:
          - target: release-linux-amd64
            os: ubuntu-latest
          - target: release-windows-amd64
            os: ubuntu-latest
          - target: release-linux-arm64
            os: ubuntu-24.04-arm
          - target: release-windows-arm64
            os: ubuntu-24.04-arm
          - target: release-mac
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      -
        name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        # only the darwin target builds on the runner; the others build inside
        # goreleaser-cross, which brings its own go
        name: setup go
        if: matrix.target == 'release-mac'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      -
        # the linux and windows targets run goreleaser inside goreleaser-cross,
        # only the darwin target needs it on the runner itself
        name: install goreleaser
        if: matrix.target == 'release-mac'
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
      -
        name: ${{ matrix.target }}
        run: make ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
